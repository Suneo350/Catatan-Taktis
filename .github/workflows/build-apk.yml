

name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Pasang dependensi
        run: npm install

      - name: Siapkan web dan library offline
        run: |
          mkdir -p www/lib
          cp index.html www/index.html
          cp node_modules/html2canvas/dist/html2canvas.min.js www/lib/
          cp node_modules/jspdf/dist/jspdf.umd.min.js www/lib/

      - name: Buat proyek Android
        run: npx cap add android

      - name: Pasang ikon aplikasi
        continue-on-error: true
        run: |
          R=android/app/src/main/res
          for d in "mdpi 48 108" "hdpi 72 162" "xhdpi 96 216" "xxhdpi 144 324" "xxxhdpi 192 432"; do
            set -- $d
            convert icon.png -resize $2x$2 $R/mipmap-$1/ic_launcher.png
            convert icon.png -resize $2x$2 $R/mipmap-$1/ic_launcher_round.png
            convert icon.png -resize $3x$3 $R/mipmap-$1/ic_launcher_foreground.png
          done

      - run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: catatan-taktis-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
